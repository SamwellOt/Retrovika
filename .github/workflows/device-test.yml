# Temporário: roda o app num emulador Android para capturar o crash dos núcleos com GPU.
name: Device test
on:
  push:
    branches: [claude/menu-navigation-performance-qyjolq]
    paths: ['.github/workflows/device-test.yml', '.github/device-test.sh']
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - name: ROMs de teste (homebrew livre)
        run: |
          mkdir -p roms-test/n64
          git clone --depth 1 https://github.com/PeterLemon/N64 pl
          find pl -iname '*.n64' | head -200 > list.txt
          wc -l list.txt
          # Uma demo que desenha pela RDP e uma que usa o framebuffer direto.
          cp "$(grep -i '/RDP/' list.txt | head -1)" roms-test/n64/rdp.n64 || true
          cp "$(grep -iv '/RDP/' list.txt | head -1)" roms-test/n64/cpu.n64 || true
          ls -la roms-test/n64
      - name: Habilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/device-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-out
          path: device-out
