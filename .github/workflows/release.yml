# Publica uma release com o APK quando uma tag v* é enviada (ex.: git push origin v0.2.0).
#
# Assinatura: com os secrets RETROVIKA_KEYSTORE_BASE64, RETROVIKA_KEYSTORE_PASSWORD,
# RETROVIKA_KEY_ALIAS e RETROVIKA_KEY_PASSWORD, o APK sai com a chave do projeto e atualiza
# instalações anteriores. Sem eles, sai com uma chave de debug gerada no runner.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release, ex. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # O runner ubuntu já traz o Android SDK (ANDROID_HOME) com as licenças aceitas.
      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.RETROVIKA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RETROVIKA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem RETROVIKA_KEYSTORE_BASE64: o APK sai com chave de debug e não atualiza instalações assinadas com outra chave."
          fi

      - name: Testes de unidade
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: APK de release
        env:
          RETROVIKA_KEYSTORE_PASSWORD: ${{ secrets.RETROVIKA_KEYSTORE_PASSWORD }}
          RETROVIKA_KEY_ALIAS: ${{ secrets.RETROVIKA_KEY_ALIAS }}
          RETROVIKA_KEY_PASSWORD: ${{ secrets.RETROVIKA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          version="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "Retrovika-$version.apk"
          echo "APK=Retrovika-$version.apk" >> "$GITHUB_ENV"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Retrovika ${TAG#v}" "${args[@]}"
          fi
