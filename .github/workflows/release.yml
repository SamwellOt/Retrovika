# Publica uma release com o APK quando uma tag v* é enviada (ex.: git push origin v0.2.0)
# ou quando o workflow é disparado à mão com o nome da tag, que é criada no commit compilado.
# Disparado à mão para uma release que já existe, troca o APK, relê as notas e move a tag para o commit.
#
# Assinatura: com os secrets RETROVIKA_KEYSTORE_BASE64, RETROVIKA_KEYSTORE_PASSWORD,
# RETROVIKA_KEY_ALIAS e RETROVIKA_KEY_PASSWORD, o APK sai com a chave do projeto e atualiza
# instalações anteriores. Sem eles a release falha: uma chave de debug gerada no runner muda a cada
# execução, e o APK não atualizaria nenhuma instalação (nem pelo atualizador do app).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release, ex. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Disparado à mão, compila o commit escolhido no "Run workflow" (a main, normalmente)
      # e a release cria a tag nele.
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # O runner ubuntu já traz o Android SDK (ANDROID_HOME) com as licenças aceitas.
      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.RETROVIKA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RETROVIKA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::error::Sem RETROVIKA_KEYSTORE_BASE64: o APK sairia com uma chave de debug e não atualizaria nenhuma instalação."
            exit 1
          fi

      - name: Testes de unidade
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: APK de release
        env:
          RETROVIKA_KEYSTORE_PASSWORD: ${{ secrets.RETROVIKA_KEYSTORE_PASSWORD }}
          RETROVIKA_KEY_ALIAS: ${{ secrets.RETROVIKA_KEY_ALIAS }}
          RETROVIKA_KEY_PASSWORD: ${{ secrets.RETROVIKA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          version="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "Retrovika-$version.apk"
          echo "APK=Retrovika-$version.apk" >> "$GITHUB_ENV"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Republicar uma release (APK corrigido): as notas são relidas do arquivo e a tag passa
            # para o commit compilado, para APK, texto e código-fonte da release baterem.
            gh release upload "$TAG" "$APK" --clobber
            if [ -f "$notes" ]; then gh release edit "$TAG" --notes-file "$notes"; fi
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              git push -f origin "$GITHUB_SHA:refs/tags/$TAG"
            fi
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Retrovika ${TAG#v}" "${args[@]}"
          fi
