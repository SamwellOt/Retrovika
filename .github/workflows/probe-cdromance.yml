# Temporário: inspeciona a estrutura das páginas do CDRomance (removido em seguida).
name: Probe CDRomance
on:
  push:
    branches: [claude/menu-navigation-performance-qyjolq]
    paths: ['.github/workflows/probe-cdromance.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Retrovika/0.1 (Android)"
          for path in "" "gba-roms/" "gba-roms/page/2/" "nes-roms/" "snes-rom/" "psx-iso/" "psp/" "n64-roms/" "gameboy-roms/" "?s=mario" ; do
            url="https://cdromance.org/$path"
            echo "================ $url"
            curl -sSL -A "$UA" -o page.html -w "status=%{http_code} final=%{url_effective} size=%{size_download}\n" "$url" || true
            echo "game-container: $(grep -o 'game-container' page.html | wc -l)"
            echo "console classes: $(grep -oE 'class="console [^"]*"' page.html | sort | uniq -c | head -20 | tr '\n' ';')"
            echo "page-numbers: $(grep -oE 'class="[^"]*page-numbers[^"]*"[^>]*>[^<]*' page.html | head -8 | tr '\n' ';')"
            echo "title: $(grep -oE '<title>[^<]*' page.html | head -1)"
            echo "--- primeiro card:"
            python3 - <<'PY'
          import re
          s=open('page.html',encoding='utf-8',errors='replace').read()
          i=s.find('game-container')
          print(s[max(0,i-200):i+1500] if i>=0 else s[:1500])
          PY
          done
          echo "================ menu de consoles (links da home)"
          curl -sSL -A "$UA" https://cdromance.org/ | grep -oE 'href="https://cdromance.org/[a-z0-9-]+/"' | sort -u | head -80
