# Compila e roda os testes de unidade em cada PR e push na main.
name: Build

on:
  pull_request:
  push:
    # Branches de trabalho do Claude também compilam a cada push, antes mesmo de virar PR.
    branches: [main, 'claude/**']
  # Disparo manual: compila qualquer branch sem precisar abrir PR.
  workflow_dispatch:

jobs:
  build:
    # Branches claude/** do próprio repositório já compilam no push; o PR delas não repete o mesmo build.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/') || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # O runner ubuntu já traz o Android SDK (ANDROID_HOME) com as licenças aceitas.
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes de unidade
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: APK de debug
        run: ./gradlew assembleDebug --stacktrace
