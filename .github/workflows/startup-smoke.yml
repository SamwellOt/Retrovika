# Abre o APK num emulador e confere que o app não fecha sozinho na abertura (a 0.5.0 fechava).
# Roda com o APK release minificado pelo R8, que é o que os usuários instalam.
name: Startup smoke

on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/startup-smoke.yml'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag de uma release para testar o APK publicado (vazio compila o commit)'
        required: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK publicado
        if: github.event.inputs.release != ''
        run: |
          mkdir -p out
          curl -sSLo out/app.apk "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.release }}/Retrovika-${GITHUB_EVENT_INPUTS_RELEASE#v}.apk"
        env:
          GITHUB_EVENT_INPUTS_RELEASE: ${{ github.event.inputs.release }}
      - name: APK release do commit
        if: github.event.inputs.release == ''
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/app.apk
      - name: Abrir no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/startup-smoke.sh out/app.apk out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-api${{ matrix.api }}
          path: out/*.txt
