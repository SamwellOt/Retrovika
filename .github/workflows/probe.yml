# Temporário: sonda os sites de dados de jogos para a página de detalhes.
name: Probe
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sondas
        run: |
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          get() { echo; echo "=================== $1"; curl -sL -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' --max-time 20 -o /tmp/out -w "HTTP %{http_code} %{size_download}B %{time_total}s\n" "$1"; }
          sq() { tr -s ' \t' ' ' < /tmp/out | grep -v '^ *$'; }
          get "https://backloggd.com/games/super-mario-64/"
          sq | sed -n '/og:title/,/og:title/p' | head -3
          echo "----- header"; sq | awk '/t_1080p/{f=1} f{print} /id="game-rating"/{exit}' | grep -v 'shimmer' | head -150
          echo "----- counters"; sq | awk '/log-counters/{f=1} f{print} /time-played-overview mt-3/{exit}' | head -170
          echo "----- related"; sq | grep -n -i -E 'related|remake|port|series|mod' | head -20
          get "https://backloggd.com/reviews/preview/super-mario-64/?sort_by=trending"; sq | head -150
          get "https://backloggd.com/autocomplete.json?query=kamen%20rider"; head -c 1200 /tmp/out; echo
          get "https://backloggd.com/autocomplete.json?query=chrono%20trigger"; head -c 600 /tmp/out; echo
          get "https://backloggd.com/games/chrono-trigger/"; sq | grep -n -E 'game-page-platform|/games/lib/popular/release_year|href="/company' | head -20
          get "https://cdromance.org/psx-iso/digimon-world-2003-rb-select/"
          echo "----- article"; sq | awk '/<article /{f=1} f{print} /Show Links/{exit}' | grep -v rmp- | head -140
          echo "----- screenshots"; sq | grep -n -i -E 'screenshot|gallery|lightbox|wp-content/uploads' | head -30
          get "https://cdromance.org/gba-roms/"; G=$(grep -o 'https://cdromance.org/gba-roms/[^"/]*/' /tmp/out | grep -v '/page/' | sed -n 5p); echo "game=$G"
          get "$G"; sq | awk '/<article /{f=1} f{print} /Show Links/{exit}' | grep -v rmp- | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | grep -v '^ *$' | head -80
          get "https://archive.org/metadata/chrono-trigger-usa/metadata"; head -c 2500 /tmp/out; echo
          get "https://archive.org/advancedsearch.php?q=mediatype%3A(software)%20AND%20(Super%20Nintendo)&fl[]=identifier&rows=3&output=json"; I=$(python3 -c "import json;print(json.load(open('/tmp/out'))['response']['docs'][0]['identifier'])"); echo $I
          get "https://archive.org/metadata/$I/metadata"; head -c 2500 /tmp/out; echo
          get "https://www.wikidata.org/w/api.php?action=wbgetentities&ids=Q216995&props=claims&format=json"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/out'))['entities']['Q216995']['claims']
          for p in ['P31','P136','P178','P123','P577','P400','P404','P179','P86','P57','P444','P2816','P11688','P1933','P5794','P12054','P1712','P750','P437','P408','P407','P852','P908','P914','P155','P156','P18','P154','P856']:
              if p in d:
                  out=[]
                  for c in d[p][:4]:
                      v=c['mainsnak'].get('datavalue',{}).get('value')
                      q={k:[x.get('datavalue',{}).get('value') for x in vv] for k,vv in c.get('qualifiers',{}).items()}
                      out.append((v,q) if q else v)
                  print(p, json.dumps(out)[:400])
          PY
          get "https://pt.wikipedia.org/w/api.php?action=query&list=search&srsearch=Chrono%20Trigger%20jogo%20eletr%C3%B4nico&srlimit=3&format=json"; head -c 800 /tmp/out; echo
          get "https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=Chrono%20Trigger%20video%20game&srlimit=3&format=json"; head -c 800 /tmp/out; echo
          get "https://www.wikidata.org/w/api.php?action=wbgetentities&ids=Q1080026|Q150248|Q170323&props=labels&languages=pt|en&format=json"; head -c 800 /tmp/out; echo
