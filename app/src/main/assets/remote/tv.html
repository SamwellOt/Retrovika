<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Retrovika</title>
<style>
  :root {
    --ink: #0B0714; --surface: #130E21; --high: #1B152E; --outline: #342B55;
    --neon: #FF3D8B; --cyan: #36E2F5; --sun: #FFC857; --orange: #FF8A3D; --violet: #8B6CFF;
    --text: #F5F1FB; --text2: #ABA3C4; --muted: #6E6690;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); overflow: hidden;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.idle { cursor: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; z-index: 10;
    background: radial-gradient(120% 90% at 50% 120%, #2A0C52 0%, var(--ink) 62%); }
  .overlay.hidden { display: none; }
  .card { max-width: 440px; width: 100%; }
  .logo { font: 800 44px/1 system-ui, sans-serif; letter-spacing: .02em; background: linear-gradient(90deg, var(--neon), var(--orange), var(--sun));
    -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
  .kicker { font: 600 13px/1 ui-monospace, "JetBrains Mono", monospace; letter-spacing: .2em; color: var(--cyan); text-transform: uppercase; margin-bottom: 30px; }
  .msg { color: var(--text2); margin: 0 0 22px; }
  .game { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  input { width: 100%; font: 700 34px/1 ui-monospace, monospace; letter-spacing: .4em; text-align: center; padding: 16px; border-radius: 18px;
    border: 1px solid var(--outline); background: var(--high); color: var(--text); outline: none; margin-bottom: 16px; }
  input:focus { border-color: var(--neon); }
  button.go { width: 100%; padding: 17px; border: 0; border-radius: 99px; font: 700 18px/1 system-ui, sans-serif; color: #000; cursor: pointer;
    background: linear-gradient(90deg, var(--neon), var(--orange), var(--sun)); }
  button.go:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  .keys { margin-top: 26px; color: var(--muted); font-size: 13px; }
  .spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--outline); border-top-color: var(--neon); margin: 0 auto 20px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #join { position: fixed; right: 24px; bottom: 24px; z-index: 5; display: flex; gap: 16px; align-items: center; padding: 14px; border-radius: 22px;
    background: #0B0714e6; border: 1px solid var(--outline); box-shadow: 0 10px 40px #0008; max-width: 440px; transition: opacity .4s; }
  #join.hidden { opacity: 0; pointer-events: none; }
  #join img { width: 132px; height: 132px; border-radius: 12px; background: #fff; display: block; flex: none; }
  #join .t { font-weight: 700; margin-bottom: 4px; }
  #join .s { color: var(--text2); font-size: 14px; }
  #join .k { color: var(--muted); font: 12px/1.4 ui-monospace, monospace; margin-top: 8px; }

  #toast { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 6; padding: 10px 18px; border-radius: 99px;
    background: #1B152Ef0; border: 1px solid var(--outline); font-weight: 600; transition: opacity .3s; white-space: nowrap; }
  #toast.hidden { opacity: 0; }
  #paused { position: fixed; inset: 0; display: none; place-items: center; z-index: 4; background: #0008; pointer-events: none; }
  #paused.on { display: grid; }
  #paused span { font: 800 28px/1 ui-monospace, monospace; letter-spacing: .3em; color: var(--sun); text-shadow: 0 0 24px #000; }
  #players { position: fixed; left: 20px; bottom: 20px; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font: 700 12px/1 ui-monospace, monospace; letter-spacing: .06em; padding: 8px 11px; border-radius: 99px; color: #000; }
  #help { position: fixed; inset: 0; z-index: 8; display: none; place-items: center; background: #000c; }
  #help.on { display: grid; }
  #help table { border-collapse: collapse; background: var(--surface); border: 1px solid var(--outline); border-radius: 16px; overflow: hidden; }
  #help td { padding: 8px 18px; border-bottom: 1px solid var(--outline); }
  #help td:first-child { font: 700 14px ui-monospace, monospace; color: var(--cyan); text-align: right; }
</style>
</head>
<body>
<video id="v" muted playsinline autoplay disablepictureinpicture></video>
<div id="paused"><span></span></div>
<div id="players"></div>
<div id="join" class="hidden"><img id="qr" alt=""><div><div class="t" id="joinT"></div><div class="s" id="joinS"></div><div class="k" id="joinK"></div></div></div>
<div id="toast" class="hidden"></div>
<div id="help"></div>
<div class="overlay" id="gate"><div class="card" id="gateCard"></div></div>
<script>
(() => {
  const pt = (navigator.language || '').toLowerCase().startsWith('pt');
  const T = pt ? {
    kicker: 'Tela do jogo', code: 'Digite o código que aparece no menu do jogo, no celular (aba Tela e controles).', connect: 'Conectar',
    start: 'Começar', ready: 'Pronto para jogar', connecting: 'Conectando ao celular…', reconnect: 'Reconectando…',
    badCode: 'Não deu para conectar. Confira o código e se o computador e o celular estão na mesma rede.',
    noVideo: 'Este celular não consegue enviar a imagem (precisa de OpenGL ES 3). Os controles funcionam.',
    noCodec: 'Este navegador não reproduz vídeo H.264. Tente o Chrome, o Edge ou o Firefox.',
    videoFailed: 'A imagem não está saindo do celular (o aparelho recusou a captura). Som e controles funcionam.',
    joinT: 'Jogue com o celular', joinS: 'Aponte a câmera de outro celular para o código: ele vira um controle.',
    joinK: 'Teclado ou controle no PC também jogam. H: teclas · F: tela cheia',
    keyboard: 'Teclado', gamepad: 'Controle', player: 'Jogador', full: 'Não há vaga: o jogo já tem 4 jogadores.',
    paused: 'PAUSADO', kicked: 'Removido pelo celular do jogo.', replaced: 'O jogo foi aberto em outra aba deste navegador.',
    help: [['Setas', 'Direcional'], ['X / Z', 'A / B'], ['S / A', 'X / Y'], ['Q / W', 'L / R'], ['E / R', 'L2 / R2'], ['Enter', 'Start'], ['Shift', 'Select'], ['F', 'Tela cheia'], ['J', 'Mostrar/ocultar o QR'], ['H', 'Esta ajuda']]
  } : {
    kicker: 'Game screen', code: 'Enter the code shown in the game menu on the phone (Screen & controllers tab).', connect: 'Connect',
    start: 'Start', ready: 'Ready to play', connecting: 'Connecting to the phone…', reconnect: 'Reconnecting…',
    badCode: "Couldn't connect. Check the code and that the computer and the phone are on the same network.",
    noVideo: "This phone can't send the picture (it needs OpenGL ES 3). Controllers still work.",
    noCodec: "This browser can't play H.264 video. Try Chrome, Edge or Firefox.",
    videoFailed: "The picture isn't leaving the phone (the device refused the capture). Sound and controllers still work.",
    joinT: 'Play with your phone', joinS: 'Point another phone camera at the code: it becomes a controller.',
    joinK: 'A keyboard or controller on this PC can play too. H: keys · F: fullscreen',
    keyboard: 'Keyboard', gamepad: 'Controller', player: 'Player', full: 'No free slot: the game already has 4 players.',
    paused: 'PAUSED', kicked: 'Removed by the game phone.', replaced: 'The game was opened in another tab of this browser.',
    help: [['Arrows', 'D-pad'], ['X / Z', 'A / B'], ['S / A', 'X / Y'], ['Q / W', 'L / R'], ['E / R', 'L2 / R2'], ['Enter', 'Start'], ['Shift', 'Select'], ['F', 'Fullscreen'], ['J', 'Show/hide the QR'], ['H', 'This help']]
  };
  const PLAYER_COLORS = ['#FF3D8B', '#36E2F5', '#FFC857', '#8B6CFF'];
  const $ = (id) => document.getElementById(id);
  const video = $('v');
  const qs = new URLSearchParams(location.search);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  // Só dígitos: o código entra no HTML do formulário, e um ?c= com marcação viraria script na página.
  let code = (qs.get('c') || store.get('rv-code') || '').replace(/\D/g, '').slice(0, 6);
  let clientId = store.get('rv-screen-id');
  if (!clientId) { clientId = 's' + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('rv-screen-id', clientId); }

  $('help').innerHTML = '<table>' + T.help.map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</table>';
  $('joinT').textContent = T.joinT; $('joinS').textContent = T.joinS; $('joinK').textContent = T.joinK;
  $('paused').firstElementChild.textContent = T.paused;

  function gate(html) { $('gateCard').innerHTML = '<div class="logo">RETROVIKA</div><div class="kicker">' + T.kicker + '</div>' + html; $('gate').classList.remove('hidden'); }
  function askCode(error) {
    gate('<p class="msg">' + (error || T.code) + '</p><input id="code" inputmode="numeric" maxlength="6" autocomplete="off" value="' + (code || '') + '">' +
      '<button class="go" id="go">' + T.connect + '</button>');
    const input = $('code');
    input.focus();
    const submit = () => { code = input.value.replace(/\D/g, ''); if (code) connect(); };
    $('go').onclick = submit;
    input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  }
  function waiting(text) { gate('<div class="spinner"></div><p class="msg">' + text + '</p>'); }
  let toastTimer = null;
  function toast(text, ms) {
    $('toast').textContent = text; $('toast').classList.remove('hidden');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.add('hidden'), ms || 3000);
  }

  // --- Conexão ---
  let ws = null, opened = false, everConnected = false, failedTries = 0, started = false, stopped = false, info = null, retryTimer = null;
  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
  function connect() {
    clearTimeout(retryTimer);
    opened = false;
    if (!started) waiting(T.connecting);
    ws = new WebSocket('ws://' + location.host + '/ws?role=screen&c=' + encodeURIComponent(code) + '&id=' + encodeURIComponent(clientId) +
      '&name=' + encodeURIComponent(browserName()));
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { opened = true; everConnected = true; failedTries = 0; freshInfo = true; store.set('rv-code', code); if (started) toast('✓', 800); };
    ws.onmessage = (e) => {
      if (typeof e.data === 'string') { let m; try { m = JSON.parse(e.data); } catch (_) { return; } onMessage(m); }
      else onBinary(e.data);
    };
    ws.onclose = () => {
      // Um pedido de vaga sem resposta não pode ficar pendente: na volta, a próxima tecla pede de novo.
      Object.values(players).forEach((p) => { p.port = null; p.pending = false; p.full = false; });
      renderPlayers();
      if (stopped) return;
      if (!opened && (!everConnected || ++failedTries >= 8)) { everConnected = false; failedTries = 0; askCode(T.badCode); return; }
      if (started) toast(T.reconnect, 60000); else waiting(T.reconnect);
      retryTimer = setTimeout(connect, 1200);
    };
  }
  function browserName() {
    const ua = navigator.userAgent;
    const os = /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'Mac' : /CrOS/.test(ua) ? 'ChromeOS' : /Android/.test(ua) ? 'Android' : /Linux/.test(ua) ? 'Linux' : '';
    const br = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
    return [os, br].filter(Boolean).join(' · ') || 'Browser';
  }

  // O "info" chega de novo a cada jogador que entra ou sai; só o primeiro depois de conectar mexe na tela.
  let freshInfo = false;
  function onMessage(m) {
    if (m.t === 'info') {
      const first = freshInfo;
      freshInfo = false;
      const gameChanged = !info || info.game !== m.game;
      // Só uma vaga aberta de verdade libera quem ficou sem lugar; limpar a cada "info" (que o próprio
      // "full" provoca) faria o controle pedir vaga de novo a cada quadro, sem fim.
      const freed = !info || m.players < info.players;
      info = m;
      document.title = (m.game ? m.game + ' · ' : '') + 'Retrovika';
      const qr = m.join ? '/qr.svg?c=' + encodeURIComponent(code) + '&v=' + encodeURIComponent(m.join) : '';
      if (qr && $('qr').getAttribute('src') !== qr) $('qr').src = qr;
      if (!m.video && (first || gameChanged)) toast(T.noVideo, 8000);
      // Uma vaga pode ter aberto: quem ficou sem lugar tenta de novo na próxima tecla.
      if (freed) Object.values(players).forEach((p) => { p.full = false; });
      showJoin();
      if (!first) return;
      if (!started) {
        gate('<p class="game">' + escapeHtml(m.game || T.ready) + '</p><p class="msg">' + escapeHtml(m.system || '') + '</p>' +
          '<button class="go" id="go">' + T.start + '</button><div class="keys">' + T.joinK + '</div>');
        const go = $('go');
        go.focus();
        go.onclick = begin;
      } else {
        // Reconectou (talvez depois de pedir o código de novo): volta direto ao jogo e tira o "Reconectando…".
        $('gate').classList.add('hidden');
        if (m.video) toast('', 1);
      }
    } else if (m.t === 'video') setupVideo(m.codec);
    else if (m.t === 'videoFailed') toast(T.videoFailed, 10000);
    else if (m.t === 'paused') $('paused').classList.toggle('on', !!m.v);
    else if (m.t === 'player') {
      const p = players[m.p]; if (!p) return;
      p.port = m.port; p.pending = false;
      toast(p.label + ' → ' + T.player + ' ' + (m.port + 1));
      renderPlayers();
      resend(p);
    } else if (m.t === 'full') {
      const p = players[m.p]; if (p) { p.pending = false; p.full = true; }
      toast(T.full, 5000);
    } else if (m.t === 'kicked') { stopped = true; started = false; gate('<p class="msg">' + T.kicked + '</p>'); }
    else if (m.t === 'replaced') {
      stopped = true; started = false;
      gate('<p class="msg">' + T.replaced + '</p><button class="go" id="go">' + T.connect + '</button>');
      $('go').onclick = () => { stopped = false; connect(); };
    }
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

  function begin() {
    started = true;
    $('gate').classList.add('hidden');
    ensureAudio();
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) Promise.resolve(req.call(el)).catch(() => {});
    video.play().catch(() => {});
    showJoin();
  }

  // --- Vídeo: MP4 fragmentado no Media Source Extensions, sempre perto do quadro mais novo ---
  const MS = window.ManagedMediaSource || window.MediaSource;
  // Fila: { data, key, init }. Um quadro P sem os anteriores não decodifica, então quando é preciso
  // jogar quadros fora a fila recomeça num quadro-chave (waitKey), nunca no meio.
  let ms = null, sb = null, queue = [], waitKey = false, lastRestart = 0;
  function setupVideo(codec) {
    const type = 'video/mp4; codecs="' + codec + '"';
    if (!MS || !MS.isTypeSupported(type)) { toast(T.noCodec, 10000); return; }
    if (video.src) { URL.revokeObjectURL(video.src); }
    queue = []; sb = null; waitKey = false;
    ms = new MS();
    video.disableRemotePlayback = true;
    // Onde o navegador aceita a dica, o player não junta quadros antes de mostrar.
    if ('latencyHint' in video) { try { video.latencyHint = 0; } catch (_) {} }
    video.src = URL.createObjectURL(ms);
    const current = ms;
    ms.addEventListener('sourceopen', () => {
      if (current !== ms) return;
      try { sb = ms.addSourceBuffer(type); } catch (e) { restartVideo(); return; }
      sb.mode = 'segments';
      sb.addEventListener('updateend', () => { keepUp(); pump(); });
      sb.addEventListener('error', restartVideo);
      pump();
    }, { once: true });
  }
  // O player travou (erro de decodificação, buffer removido): pede ao celular o início de novo.
  function restartVideo() {
    const now = Date.now();
    if (now - lastRestart < 2000) return;
    lastRestart = now;
    send({ t: 'restart' });
  }
  video.addEventListener('error', restartVideo);
  function skipToKey() {
    // Guarda o segmento de inicialização e recomeça no último quadro-chave da fila; sem nenhum, espera o próximo.
    let k = -1;
    for (let i = queue.length - 1; i >= 0; i--) if (queue[i].key) { k = i; break; }
    const init = queue.filter((q) => q.init);
    if (k >= 0) queue = init.concat(queue.slice(k).filter((q) => !q.init));
    else { queue = init; waitKey = true; send({ t: 'key' }); }
  }
  function pump() {
    if (!sb || sb.updating || !queue.length || !ms || ms.readyState !== 'open') return;
    const item = queue.shift();
    try { sb.appendBuffer(item.data); }
    catch (e) {
      if (e.name === 'QuotaExceededError') {
        // Cota cheia: descarta o que já passou e continua do próximo quadro-chave.
        queue.unshift(item); skipToKey();
        try { if (video.buffered.length) sb.remove(0, Math.max(0, video.currentTime - 1)); } catch (_) {}
      } else restartVideo();
    }
  }
  function enqueue(item) {
    if (waitKey && !item.init) { if (!item.key) return; waitKey = false; }
    queue.push(item);
    // O navegador não está dando conta (aba em segundo plano, CPU fraca): pula para o mais novo.
    if (queue.length > 90) skipToKey();
    pump();
  }
  // Segura o mínimo possível atrás do último quadro recebido: cada quadro guardado é atraso na tela.
  function keepUp() {
    if (!sb || !video.buffered.length) return;
    const last = video.buffered.length - 1;
    const end = video.buffered.end(last);
    const lag = end - video.currentTime;
    // Atrasou demais (aba escondida, Wi-Fi engasgou): pula para o fim em vez de acelerar.
    if (lag > 0.2 || video.currentTime < video.buffered.start(last)) video.currentTime = Math.max(video.buffered.start(last), end - 0.03);
    else video.playbackRate = lag > 0.1 ? 1.5 : lag > 0.06 ? 1.25 : lag > 0.035 ? 1.1 : 1;
  }
  setInterval(() => {
    if (!sb || !video.buffered.length) return;
    keepUp();
    if (video.paused && started) video.play().catch(() => {});
    if (!sb.updating && !queue.length && video.currentTime - video.buffered.start(0) > 30) {
      try { sb.remove(0, video.currentTime - 10); } catch (_) {}
    }
  }, 100);

  // --- Áudio: PCM de 16 bits agendado em sequência no Web Audio ---
  // A folga começa em 40 ms e só cresce (até 120 ms) quando o som falta, num Wi-Fi que oscila mais.
  let actx = null, nextTime = 0, lead = 0.04;
  function ensureAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC({ latencyHint: 'interactive' });
    if (actx.state === 'suspended') actx.resume();
  }
  function playAudio(buf) {
    if (!actx || actx.state !== 'running') return;
    const dv = new DataView(buf);
    const rate = dv.getUint32(4, true);
    const samples = new Int16Array(buf, 8);
    const frames = samples.length >> 1;
    if (!frames || rate < 3000) return;
    const now = actx.currentTime;
    if (nextTime < now + 0.01) {
      // Faltou por pouco: é oscilação da rede. Um buraco longo é jogo pausado, não conta.
      if (nextTime > 0 && now - nextTime < 0.5) lead = Math.min(0.12, lead + 0.02);
      nextTime = now + lead;
    } else if (nextTime > now + lead + 0.1) return; // acumulou atraso: joga fora um pedaço
    const ab = actx.createBuffer(2, frames, rate);
    const l = ab.getChannelData(0), r = ab.getChannelData(1);
    for (let i = 0; i < frames; i++) { l[i] = samples[2 * i] / 32768; r[i] = samples[2 * i + 1] / 32768; }
    const src = actx.createBufferSource();
    src.buffer = ab; src.connect(actx.destination); src.start(nextTime);
    nextTime += frames / rate;
  }

  function onBinary(buf) {
    const type = new Uint8Array(buf, 0, 1)[0];
    if (type === 1) enqueue({ data: buf.slice(1), key: false, init: true });
    else if (type === 2 || type === 4) enqueue({ data: buf.slice(1), key: type === 4, init: false });
    else if (type === 3) playAudio(buf);
  }

  // --- Jogadores deste computador: teclado (slot 0) e controles (slot 1 + índice) ---
  const players = {};
  const KEY = { A: 96, B: 97, X: 99, Y: 100, L1: 102, R1: 103, L2: 104, R2: 105, L3: 106, R3: 107, START: 108, SELECT: 109 };
  const KEYBOARD = { KeyX: KEY.A, KeyZ: KEY.B, KeyS: KEY.X, KeyA: KEY.Y, KeyQ: KEY.L1, KeyW: KEY.R1, KeyE: KEY.L2, KeyR: KEY.R2,
    Enter: KEY.START, ShiftLeft: KEY.SELECT, ShiftRight: KEY.SELECT };
  const ARROWS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  function player(slot, label) {
    let p = players[slot];
    if (!p) p = players[slot] = { slot, label, port: null, pending: false, full: false, keys: new Set(), motion: {} };
    if (p.port == null && !p.pending && !p.full) { p.pending = true; send({ t: 'join', p: slot }); }
    return p;
  }
  function key(p, code, down) {
    if (down) p.keys.add(code); else p.keys.delete(code);
    if (p.port != null) send({ t: 'k', p: p.slot, c: code, d: down ? 1 : 0 });
  }
  function motion(p, s, x, y) {
    const prev = p.motion[s];
    if (prev && Math.abs(prev[0] - x) < 0.01 && Math.abs(prev[1] - y) < 0.01) return;
    p.motion[s] = [x, y];
    if (p.port != null) send({ t: 'm', p: p.slot, s, x: +x.toFixed(3), y: +y.toFixed(3) });
  }
  // O jogador acabou de receber a porta: o que já está apertado vale.
  function resend(p) {
    p.keys.forEach((c) => send({ t: 'k', p: p.slot, c, d: 1 }));
    Object.keys(p.motion).forEach((s) => send({ t: 'm', p: p.slot, s: +s, x: p.motion[s][0], y: p.motion[s][1] }));
  }
  function renderPlayers() {
    $('players').innerHTML = Object.values(players).filter((p) => p.port != null).map((p) =>
      '<span class="chip" style="background:' + (PLAYER_COLORS[p.port] || '#fff') + '">P' + (p.port + 1) + ' · ' + escapeHtml(p.label) + '</span>').join('');
  }

  const arrows = new Set();
  document.addEventListener('keydown', (e) => {
    if (!started) return;
    // Atalhos do navegador e do sistema (Ctrl+R, Ctrl+F, Alt+Tab...) passam direto: não viram botão nem são engolidos.
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'KeyF') { toggleFullscreen(); return; }
    if (e.code === 'KeyH') { $('help').classList.toggle('on'); return; }
    if (e.code === 'KeyJ') { joinHidden = !joinHidden; showJoin(); return; }
    if (e.code === 'Escape') { $('help').classList.remove('on'); return; }
    const mapped = KEYBOARD[e.code];
    if (mapped == null && !ARROWS[e.code]) return;
    e.preventDefault();
    if (e.repeat) return;
    const p = player(0, T.keyboard);
    if (mapped != null) key(p, mapped, true);
    else { arrows.add(e.code); sendArrows(p); }
  });
  document.addEventListener('keyup', (e) => {
    const p = players[0];
    if (!p) return;
    const mapped = KEYBOARD[e.code];
    if (mapped != null) key(p, mapped, false);
    else if (ARROWS[e.code]) { arrows.delete(e.code); sendArrows(p); }
  });
  function sendArrows(p) {
    let x = 0, y = 0;
    arrows.forEach((c) => { x += ARROWS[c][0]; y += ARROWS[c][1]; });
    motion(p, 0, Math.sign(x), Math.sign(y));
  }
  // Fora de foco (ou aba escondida, quando o requestAnimationFrame para) nada solta o que estava apertado:
  // teclado e controles do computador são soltos aqui.
  function releaseAll() {
    Object.values(players).forEach((p) => {
      [...p.keys].forEach((c) => key(p, c, false));
      Object.keys(p.motion).forEach((s) => motion(p, +s, 0, 0));
    });
    arrows.clear();
    Object.keys(pressedPads).forEach((i) => { pressedPads[i] = {}; });
  }
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

  // Controle ligado no computador (Gamepad API, mapeamento padrão).
  const PAD_BUTTONS = [KEY.B, KEY.A, KEY.Y, KEY.X, KEY.L1, KEY.R1, KEY.L2, KEY.R2, KEY.SELECT, KEY.START, KEY.L3, KEY.R3];
  const pressedPads = {};
  function pollPads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) {
      if (!gp || !started) continue;
      const state = pressedPads[gp.index] || (pressedPads[gp.index] = {});
      const active = gp.buttons.some((b) => b.pressed) || gp.axes.some((a) => Math.abs(a) > 0.5);
      if (!players[1 + gp.index] && !active) continue;
      const p = player(1 + gp.index, T.gamepad + ' ' + (gp.index + 1));
      PAD_BUTTONS.forEach((code, i) => {
        const down = !!(gp.buttons[i] && gp.buttons[i].pressed);
        if (down !== !!state[i]) { state[i] = down; key(p, code, down); }
      });
      const b = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
      motion(p, 0, (b(15) ? 1 : 0) - (b(14) ? 1 : 0), (b(13) ? 1 : 0) - (b(12) ? 1 : 0));
      const dz = (v) => (Math.abs(v) < 0.15 ? 0 : v);
      if (gp.axes.length >= 2) motion(p, 1, dz(gp.axes[0]), dz(gp.axes[1]));
      if (gp.axes.length >= 4) motion(p, 2, dz(gp.axes[2]), dz(gp.axes[3]));
    }
    requestAnimationFrame(pollPads);
  }
  requestAnimationFrame(pollPads);
  window.addEventListener('gamepaddisconnected', (e) => {
    const slot = 1 + e.gamepad.index;
    if (players[slot]) { send({ t: 'leave', p: slot }); delete players[slot]; delete pressedPads[e.gamepad.index]; renderPlayers(); }
  });

  // --- QR para entrar, tela cheia, cursor ---
  let joinHidden = false;
  function showJoin() {
    const show = started && info && info.join && !joinHidden && (info.players || 0) === 0;
    $('join').classList.toggle('hidden', !show);
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else Promise.resolve(document.documentElement.requestFullscreen()).catch(() => {});
  }
  video.addEventListener('dblclick', toggleFullscreen);
  let idleTimer = null;
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  });
  document.addEventListener('click', () => { if (started) ensureAudio(); });

  if (code) connect(); else askCode();
})();
</script>
</body>
</html>
